name: Sync Palworld Stats

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & download report
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          pip install -q paramiko
          python -c "
          import paramiko
          import os

          host = os.environ['SFTP_HOST']
          port = int(os.environ['SFTP_PORT'])
          username = os.environ['SFTP_USER']
          password = os.environ['SFTP_PASS']

          print(f'Connecting to {host}:{port}...')
          transport = paramiko.Transport((host, port))
          transport.connect(username=username, password=password)
          
          sftp = paramiko.SFTPClient.from_transport(transport)
          print('Downloading Statistik_report.html...')
          sftp.get('Statistik_report.html', 'index.html')
          
          sftp.close()
          transport.close()
          print('Successfully downloaded and saved as index.html!')
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
