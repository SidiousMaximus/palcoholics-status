name: Sync Palworld Stats

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download report via FTP (Auto-locate)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          python - << 'EOF'
          from ftplib import FTP
          import os

          host = os.environ['SFTP_HOST']
          port = int(os.environ['SFTP_PORT'])
          username = os.environ['SFTP_USER']
          password = os.environ['SFTP_PASS']

          print(f"Connecting via FTP to {host}...")
          ftp = FTP()
          # DatHost uses port 21 for standard FTP control connections
          ftp.connect(host, 21 if port == 22 or port == 2022 else port, timeout=20)
          ftp.login(username, password)
          print("FTP Login successful!")

          # Search for the report file in current directory and subdirectories if needed
          target_file = "Statistik_report.html"
          found = False

          files = ftp.nlst()
          print(f"Files in root: {files}")

          if target_file in files:
              print(f"Found {target_file} in root directory.")
              with open("index.html", "wb") as f:
                  ftp.retrbinary(f"RETR {target_file}", f.write)
              found = True
          else:
              # Check common subdirectories recursively if not found in root
              for folder in files:
                  try:
                      ftp.cwd(folder)
                      sub_files = ftp.nlst()
                      if target_file in sub_files:
                          print(f"Found {target_file} inside subdirectory: {folder}")
                          with open("index.html", "wb") as f:
                              ftp.retrbinary(f"RETR {target_file}", f.write)
                          found = True
                          break
                      ftp.cwd("..")
                  except Exception:
                      try:
                          ftp.cwd("..")
                      except:
                          pass

          ftp.quit()

          if not found:
              raise Exception("Could not automatically locate Statistik_report.html on the FTP server.")
          print("Successfully downloaded and saved as index.html!")
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
