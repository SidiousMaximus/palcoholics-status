name: Sync Palworld Stats

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-stats-update]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download report via FTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          python - << 'EOF'
          from ftplib import FTP
          import os

          host = os.environ['SFTP_HOST']
          port = int(os.environ['SFTP_PORT'])
          username = os.environ['SFTP_USER']
          password = os.environ['SFTP_PASS']

          print(f"Connecting via FTP to {host}...")
          ftp = FTP()
          ftp.connect(host, 21 if port == 22 or port == 2022 else port, timeout=20)
          ftp.login(username, password)
          print("FTP Login successful!")

          # The mod outputs to Pal/Binaries/Win64 (relative to server root / Pal folder)
          target_path = "Binaries/Win64/Statistik_report.html"
          
          print(f"Downloading {target_path}...")
          with open("index.html", "wb") as f:
              ftp.retrbinary(f"RETR {target_path}", f.write)

          ftp.quit()
          print("Successfully downloaded and saved as index.html!")
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
