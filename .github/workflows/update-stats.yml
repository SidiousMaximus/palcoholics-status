name: Sync Palworld Stats

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download report via FTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          python -c "
          from ftplib import FTP
          import os

          host = os.environ['SFTP_HOST']
          # Use port 21 or fallback to secret port if specified
          port = int(os.environ['SFTP_PORT'])
          username = os.environ['SFTP_USER']
          password = os.environ['SFTP_PASS']

          print(f'Connecting via FTP to {host}:{port}...')
          ftp = FTP()
          ftp.connect(host, port if port != 22 else 21, timeout=15)
          ftp.login(username, password)
          
          print('Downloading Statistik_report.html...')
          with open('index.html', 'wb') as f:
              ftp.retrbinary('RETR Statistik_report.html', f.write)
          
          ftp.quit()
          print('Successfully downloaded and saved as index.html!')
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
