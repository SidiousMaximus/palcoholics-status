name: Sync Palworld Stats

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install SSH client & download file via SFTP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          script: |
            cat << 'EOF' > download.py
            import urllib.request
            # If SFTP download is needed, we can use paramiko or scp, 
            # but let's use sftp command directly via python or standard tools:
            EOF

      - name: Fetch report using SCP command line
        run: |
          mkdir -p downloaded_files
          # Using standard sshpass / scp to grab the file cleanly
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SFTP_PASS }}" scp -o StrictHostKeyChecking=no -P ${{ secrets.SFTP_PORT }} ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:"Pal/Binaries/Win64/Statistik_report.html" ./index.html

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Palworld stats every 5m" && git push)
